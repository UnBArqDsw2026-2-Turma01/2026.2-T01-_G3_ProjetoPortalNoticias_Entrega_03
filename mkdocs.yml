site_name: Portal de Notícias Burburinho - Grupo 3
site_url: https://unbarqdsw2026-2-turma01.github.io/2026.2-T01-_G3_ProjetoPortalNoticias_Entrega_03/
repo_url: https://github.com/UnBArqDsw2026-2-Turma01/2026.2-T01-_G3_ProjetoPortalNoticias_Entrega_03
repo_name: GitHub

theme:
  name: material
  language: pt-BR
  logo: assets/SapoBurburinho.svg
  favicon: assets/SapoBurburinho.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Usar preferência do sistema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mudar para o modo claro
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/UnBArqDsw2026-2-Turma01/2026.2-T01-_G3_ProjetoPortalNoticias_Entrega_03

nav:
  - Apresentação: index.md
  - Projeto:
      - Projeto: Projeto/Projeto.md
  - 1. Desenho de Software (Padrões de Projeto):
      - 1. Padrões de Projeto: Base/1.PadroesDeProjeto.md
      - Relatórios:
          - 1.1.1. SubEquipe 01: Base/Relatórios/1.1.1.SubEquipe_01.md
          - 1.1.2. SubEquipe 02: Base/Relatórios/1.1.2.SubEquipe_02.md
          - 1.1.3. SubEquipe 03: Base/Relatórios/1.1.3.SubEquipe_03.md
      - 1.2. Participações: Base/1.2.ParticipacoesPadroesDeProjeto.md
      - 1.3. Iniciativas Extras: Base/1.3.IniciativasExtras.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/diagram-zoom.js
